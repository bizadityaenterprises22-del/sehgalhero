<title>Parts Scanner — Sehgal Hero</title>
<!-- ============================================================================
  PARTS SCANNER (11-Aug-2026) — NEW MODULE, Supabase-only (CLAUDE.md rule 11).
  Photographs a spare part, reads it with the identify-part Edge Function
  (Gemini first, Vision fallback), matches against parts_all_india via the
  match_part() SQL ladder, and appends to scanned_parts. NO DELETE anywhere —
  the table has no delete policy and this page draws no delete control.
  Talks ONLY to Supabase: no Apps Script, no Google Sheets.
============================================================================ -->
<style>
  :root {
    --red: #d61f2c; --dark: #1a1a1a; --bg: #f4f4f6; --line: #ddd;
    --ok: #1a7f37; --warn: #b58900; --info: #b45309; --bad: #b91c1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
  html, body { height: 100%; background: var(--bg); }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; background: #fff; }

  header { background: var(--red); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  header .who { font-size: 12px; opacity: .9; text-align: right; line-height: 1.3; }

  main { flex: 1; overflow-y: auto; padding: 12px; }
  footer { flex-shrink: 0; border-top: 2px solid var(--line); background: #fafafa; }

  .hidden { display: none !important; }

  /* login */
  .login-box { margin-top: 12vh; padding: 0 8px; }
  .login-box h2 { font-size: 20px; margin-bottom: 18px; text-align: center; }
  .login-box label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  .login-box input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #bbb; border-radius: 6px; }
  .login-box .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 20px; }

  .btn { display: block; width: 100%; border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; }
  .btn-red { background: var(--red); color: #fff; font-size: 18px; padding: 14px; margin-top: 18px; }
  .btn-red:disabled { opacity: .5; }

  /* scan stage */
  .ctx { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctx input, .ctx select { flex: 1; font-size: 15px; padding: 9px; border: 1px solid #bbb; border-radius: 6px; min-width: 0; }

  #scanBtn { background: var(--dark); color: #fff; font-size: 22px; padding: 26px 14px; border-radius: 10px; }
  #scanBtn small { display: block; font-size: 12px; font-weight: 400; opacity: .75; margin-top: 4px; }

  #busy { text-align: center; padding: 26px 0; font-size: 16px; color: #444; }
  #busy img { max-width: 130px; max-height: 130px; border-radius: 8px; display: block; margin: 0 auto 12px; }
  .spin { display: inline-block; width: 17px; height: 17px; border: 3px solid #ccc; border-top-color: var(--red); border-radius: 50%; animation: r 0.8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* result panel */
  #result { border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; overflow: hidden; }
  #result .band { padding: 8px 12px; color: #fff; font-weight: 700; font-size: 15px; }
  #result .band.ok { background: var(--ok); } #result .band.warn { background: var(--warn); }
  #result .band.info { background: var(--info); } #result .band.bad { background: var(--bad); }
  #result table { width: 100%; border-collapse: collapse; font-size: 15px; }
  #result td { padding: 7px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  #result td:first-child { color: #666; width: 34%; font-size: 13px; padding-top: 9px; }
  #result td b.big { font-size: 18px; }
  .qtyrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .qtyrow button { width: 44px; height: 44px; font-size: 22px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; }
  .qtyrow input { width: 70px; text-align: center; font-size: 20px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  .saverow { display: flex; gap: 8px; padding: 10px 12px 12px; }
  .saverow .btn-red { margin-top: 0; font-size: 17px; padding: 13px; }
  .btn-grey { background: #e5e5e8; color: #333; font-size: 15px; padding: 13px; }

  /* manual entry */
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { flex: 1; font-size: 16px; padding: 11px; border: 1px solid #bbb; border-radius: 6px; text-transform: uppercase; min-width: 0; }
  .manual button { background: var(--dark); color: #fff; border: 0; border-radius: 6px; padding: 0 18px; font-size: 15px; cursor: pointer; }

  /* footer log */
  .logbar { display: flex; align-items: center; padding: 8px 12px; font-size: 14px; }
  .logbar b { font-size: 17px; margin: 0 5px; }
  .logbar .spacer { flex: 1; }
  #log { max-height: 160px; overflow-y: auto; }
  #log table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #log td { padding: 4px 8px; border-top: 1px solid #eee; white-space: nowrap; }
  #log td.desc { white-space: normal; }
  /* 16-09-2026: the CEO's ✕ / ↩ and how a removed row reads. */
  #log button.rm { border: 1px solid #e5e2dc; background: #fff; color: var(--bad); border-radius: 6px;
    padding: 2px 7px; font-size: 12.5px; line-height: 1.4; cursor: pointer; }
  #log button.rm:disabled { opacity: .55; cursor: wait; }
  #log tr.gone td { color: #9aa1a9; text-decoration: line-through; }
  #log tr.gone td button.rm { color: var(--ok); text-decoration: none; }
  #log .m-exact, #log .m-key, #log .m-superseded, #log .m-suffix_s { color: var(--ok); font-weight: 700; }
  /* A corrected match is a real identification, but it was reached by reasoning
     rather than by reading, so it gets its own colour — someone auditing the
     day's scans should be able to see which ones the catalogue had to fix. */
  #log .m-corrected { color: #0369a1; font-weight: 700; }
  #log .m-visual { color: var(--info); font-weight: 700; }
  #log .m-none { color: var(--bad); font-weight: 700; }
  #log .m-manual { color: #333; font-weight: 700; }

  #toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }

<div id="app">
  <header>
    <h1>🔩 Parts Scanner</h1>
    <div class="who" id="who"></div>
  </header>

  <main id="main">
    <!-- LOGIN -->
    <div id="loginView" class="login-box">
      <h2>Parts Scanner Login</h2>
      <label>Login ID (only the name — e.g. <b>parts.1050</b>)</label>
      <input id="loginCode" autocomplete="username" autocapitalize="none" placeholder="parts.1050">
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn btn-red" id="loginBtn">Sign in</button>
    </div>

    <!-- SCANNER -->
    <div id="scanView" class="hidden">
      <div class="ctx">
        <input id="boxNo" placeholder="Box / shelf no (optional)">
        <select id="cond">
          <option value="boxed">Boxed</option>
          <option value="loose">Loose</option>
          <option value="damaged">Damaged</option>
        </select>
      </div>

      <button class="btn" id="scanBtn">📷 SCAN PART
        <small>photo of the box label or the part itself</small>
      </button>
      <input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">

      <div id="busy" class="hidden"></div>
      <div id="result" class="hidden"></div>

      <div class="manual">
        <input id="manualNo" placeholder="Or type part no…">
        <button id="manualBtn">Find</button>
      </div>
    </div>
  </main>

  <footer id="foot" class="hidden">
    <div class="logbar">
      Today: <b id="nToday">0</b> parts · ₹<b id="vToday">0</b>
      <span class="spacer"></span>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
// ZXing decodes the Code-128 barcode on Hero/Hero Honda MRP labels ON the
// phone — free, no API call, and often outlives the printed text on old stock.
// The low-level pipeline (not @zxing/browser) — verified: the wrapper's
// decodeFromImageElement missed codes this pipeline reads.
import {
  MultiFormatReader, DecodeHintType, BinaryBitmap, HybridBinarizer,
  HTMLCanvasElementLuminanceSource,
} from 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/+esm'

const SUPABASE_URL = 'https://tiwfuwfzjxcsbrifcdpu.supabase.co'
const ANON_KEY = 'sb_publishable_slimmjt0POF4fhAnTAfLyQ_P1jYG9Xh'   // publishable by design
const DOMAIN = '@sehgalautoriders.co.in'

const sb = createClient(SUPABASE_URL, ANON_KEY)
const $ = (id) => document.getElementById(id)

let profile = null
let pending = null          // the scan awaiting SAVE
let scanPreviewUrl = ''
// 16-09-2026 — Ravi: "Give an option of removing any parts scanned in part
// scanner to ceo id." The answer is the server's, not this page's: migration
// 0080's ps_can_remove_scan() decides, a trigger on scanned_parts enforces it,
// and a removal is a MARK (removed_at / removed_by / removed_reason) with an
// audit row — never a delete. This flag only decides whether the ✕ is drawn.
let canRemove = false

// ---------------------------------------------------------------- helpers
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1
  setTimeout(() => { t.style.opacity = 0 }, 2200)
}
const money = (n) => n == null ? '—' : '₹' + Math.round(Number(n)).toLocaleString('en-IN')

/** Phone photos are 3–8 MB; the label is readable at 1280px for a fraction
 *  of the data. Downscale on-device before anything leaves the phone. */
function shrink(file, maxPx = 2048) {
  return new Promise((resolve) => {
    const img = new Image()
    img.onload = () => {
      const MAX = maxPx
      let { width: w, height: h } = img
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k) }
      const c = document.createElement('canvas'); c.width = w; c.height = h
      c.getContext('2d').drawImage(img, 0, 0, w, h)
      c.toBlob((b) => { c.width = 1; c.height = 1; resolve(b || file) }, 'image/jpeg', 0.90)
      URL.revokeObjectURL(img.src)
    }
    img.onerror = () => resolve(file)
    img.src = URL.createObjectURL(file)
  })
}

// ---------------------------------------------------------------- login
async function signIn() {
  const code = $('loginCode').value.trim().toLowerCase()
  const pass = $('loginPass').value
  $('loginErr').textContent = ''
  if (!code || !pass) { $('loginErr').textContent = 'Enter login ID and password.'; return }
  $('loginBtn').disabled = true
  // Old-sheet logins work exactly (12-Aug): a bare emp-no (1050) or login code
  // (parts.1050) both resolve to the real auth email via resolve_login
  // (migration 0023). Fallback keeps code+domain working if the RPC is down.
  let email = code.includes('@') ? code : ''
  if (!email) {
    try {
      const { data: mapped } = await sb.rpc('resolve_login', { p_id: code })
      if (typeof mapped === 'string' && mapped) email = mapped
    } catch { /* fall through */ }
    if (!email) email = code + DOMAIN
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass })
  $('loginBtn').disabled = false
  if (error) { $('loginErr').textContent = 'Wrong login or password.'; return }
  await enter()
}

async function enter() {
  const { data: { user } } = await sb.auth.getUser()
  if (!user) return
  const { data: p } = await sb.from('profiles').select('display_name, login_code, role').eq('id', user.id).single()
  profile = p || { display_name: user.email, login_code: '' }
  // Ask the server, never assume from the role text on this page.
  try { const { data: can } = await sb.rpc('ps_can_remove_scan'); canRemove = can === true } catch { canRemove = false }
  $('who').innerHTML = `${profile.display_name}<br>${profile.login_code}`
  $('loginView').classList.add('hidden')
  $('scanView').classList.remove('hidden')
  $('foot').classList.remove('hidden')
  refreshLog()
}

// ---------------------------------------------------------------- scanning
/** Try to decode a barcode (Code-128 etc.) straight off the photo. Tries the
 *  photo as-is and rotated 90° (labels on shelved boxes). Input is capped at
 *  2048px; the former 2× retry could allocate ~192 MB on a 12MP phone photo.
 *  Returns the decoded text or null — never throws, never blocks
 *  the AI path. */
async function readBarcode(file) {
  try {
    const url = URL.createObjectURL(file)
    const img = new Image()
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url })
    URL.revokeObjectURL(url)
    const reader = new MultiFormatReader()
    reader.setHints(new Map([[DecodeHintType.TRY_HARDER, true]]))
    const attempt = (w, h, draw) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h
      draw(c.getContext('2d'))
      try {
        return reader
          .decode(new BinaryBitmap(new HybridBinarizer(new HTMLCanvasElementLuminanceSource(c))))
          .getText().trim() || null
      } catch { return null }
    }
    const W = img.naturalWidth, H = img.naturalHeight
    return attempt(W, H, (x) => x.drawImage(img, 0, 0))
        || attempt(H, W, (x) => { x.translate(H, 0); x.rotate(Math.PI / 2); x.drawImage(img, 0, 0) })
  } catch { return null }
}

async function onPhoto(file) {
  if (!file) return
  $('result').classList.add('hidden')
  const busy = $('busy')
  busy.classList.remove('hidden')
  if (scanPreviewUrl) URL.revokeObjectURL(scanPreviewUrl)
  scanPreviewUrl = URL.createObjectURL(file)
  busy.innerHTML = `<img src="${scanPreviewUrl}"><span class="spin"></span>Reading the part…`

  try {
    // One phone-safe image feeds preview, barcode and the server.
    const small = await shrink(file, 2048)
    const barcodePromise = readBarcode(small)
    const { data: { session } } = await sb.auth.getSession()
    const form = new FormData()
    form.append('image', small, 'scan.jpg')
    const ctl = new AbortController()
    const timer = setTimeout(() => ctl.abort(), 120000)  // R102: 55 s died on mobile uploads; the Edge Function may take up to 150 s
    const res = await fetch(`${SUPABASE_URL}/functions/v1/identify-part`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${session.access_token}`, apikey: ANON_KEY },
      body: form,
      signal: ctl.signal,
    })
    clearTimeout(timer)
    const body = await res.json()
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`)
    await buildResult(body, await barcodePromise)
  } catch (e) {
    busy.classList.add('hidden')
    if (scanPreviewUrl) { URL.revokeObjectURL(scanPreviewUrl); scanPreviewUrl = '' }
    showUnreadable(null, 'Reading failed: ' + e.message)
  }
}

/** Try every number the AI saw against the master until one lands. */
async function matchNumbers(numbers) {
  for (const raw of numbers) {
    const { data, error } = await sb.rpc('match_part', { p_raw: raw })
    if (!error && data && data.length) {
      const tier = data[0].match_method
      const seen = new Set()
      const top = data.filter((x) => x.match_method === tier && !seen.has(x.part_no) && seen.add(x.part_no))
      if (top.length === 1) return { raw, hit: top[0] }
      if (top.length > 1) return { ambiguous: true, raw, hits: top.map((hit) => ({ raw, hit })) }
    }
  }
  return null
}

let AMB_SEQ = 0
function chooseMatch(m, title = 'Choose the number printed on this part') {
  const seq = ++AMB_SEQ
  return new Promise((resolve) => {
    renderCard('warn', '⚠ MORE THAN ONE MASTER MATCH', [
      ['Action', '<b>The scanner will not guess. Compare the label and tap the correct row.</b>'],
      ['Matches', (m.hits || []).map((x, i) =>
        `<button class="btn btn-grey" id="amb-${seq}-${i}" style="display:block;width:100%;margin:5px 0;text-align:left">`
        + `<b>${x.hit.part_no}</b> · ${x.hit.description || ''}</button>`).join('')],
      ['Why', title],
    ], true)
    ;(m.hits || []).forEach((x, i) => {
      const b = $(`amb-${seq}-${i}`)
      if (b) b.onclick = () => resolve(x)
    })
  })
}

/* --------------------------------------------------------------------------
   SELF-CORRECTION — the step this scanner was missing.

   Ravi, 11-Aug-2026, describing what the scanner is FOR:

     "if It caught IMDTY890 and actual part no is IMDTY8901 - and in the image
      it is a spacer and written word in part description is also a spacer,
      then it should automatically correct itself. It does in google directly
      when we scan using lens."

   Lens is not reading better than we are. Lens is checking its reading against
   a catalogue. This scanner had the reader and it had the catalogue, and the
   two were never joined: match_part() is an EXACT lookup — part_no, part_key or
   superseded_by, character for character — so one misread character produced
   "NUMBER READ — NOT IN MASTER" on a part that is sitting in the master.

   Measured on the live database before this was written:
       match_part('20K81OS')                    -> no rows
       part_ocr_sb('… 20K81OS …','CHAIN SPRO…') -> 20K810S, CHAIN SPROCKET KIT
                                                   (GLAMOUR), "camera-substitution
                                                   corrected (O/0, I/1, S/5…)"
       part_ocr_sb('CARBURETOR ASSY 16100KWH961')-> 16100KWH961S, 92%,
                                                   "description agrees 100%"
   The second is Ravi's IMDTY890 case exactly — a dropped trailing character.

   part_ocr_sb is the R29 dictionary in SQL: it pulls number-shaped tokens out
   of the label text, canonicalises the substitutions a camera actually makes
   (O/0, I/1, S/5, B/8, Z/2, G/6) on BOTH sides, and scores the survivors on how
   well the catalogue description agrees with the words on the label. The
   description agreement is what makes a correction PROVABLE rather than a
   guess — which is why the whole label text is sent, not just the number.

   The raw reading is always kept and always shown. A correction the scanner
   cannot see is a correction they cannot overrule.
   -------------------------------------------------------------------------- */
async function correctFromLabel(ai, candidates) {
  const text = [
    ...(candidates || []),
    ai && ai.raw_text ? ai.raw_text : '',
    ai && ai.part_name && ai.part_name !== 'unknown' ? ai.part_name : '',
  ].filter(Boolean).join(' ')
  if (!text.replace(/\s/g, '')) return null
  try {
    const { data, error } = await sb.rpc('part_ocr_sb', {
      p_text: text,
      p_desc: (ai && ai.part_name && ai.part_name !== 'unknown') ? ai.part_name : '',
    })
    if (error || !data || !data.found || !data.best) return null
    const score = Number(data.best.score || 0), seen = new Set()
    const choices = [data.best, ...(data.candidates || [])]
      .filter((x) => x && x.part && Number(x.score || 0) === score)
      .filter((x) => { const k = x.part.part; if (!k || seen.has(k)) return false; seen.add(k); return true })
    if (choices.length > 1) return { ...data, ambiguous: true, choices }
    return data                      // {found, best:{part:{part,desc},score,why}, candidates:[…]}
  } catch { return null }
}

async function settleCorrection(fix) {
  if (!fix || !fix.ambiguous) return fix
  const chosen = await chooseMatch({ hits: fix.choices.map((c) => ({
    raw: 'catalogue correction', hit: { part_no: c.part.part, description: c.part.desc || '' },
  })) }, 'Equal catalogue scores require an operator choice.')
  const best = fix.choices.find((c) => c.part.part === chosen.hit.part_no)
  return { ...fix, ambiguous: false, best }
}

/** Full master row for a part number the corrector proposed. */
async function masterRow(partNo) {
  const { data, error } = await sb.rpc('match_part', { p_raw: partNo })
  return (!error && data && data.length) ? data[0] : null
}

async function stockOf(partNo) {
  const { data } = await sb.from('part_stock')
    .select('curr_qty').eq('part_number', partNo).gt('curr_qty', 0)
  return (data || []).reduce((s, r) => s + (r.curr_qty || 0), 0)
}

async function avgFor(category) {
  if (!category || category === 'Unknown') return null
  const { data } = await sb.from('category_avg_price')
    .select('avg_mrp, median_mrp, priced_parts').eq('category', category)
  if (!data || !data.length) return null
  const tot = data.reduce((s, r) => s + Number(r.priced_parts), 0)
  const avg = data.reduce((s, r) => s + Number(r.avg_mrp) * Number(r.priced_parts), 0) / (tot || 1)
  return Math.round(avg)
}

/* Which engine actually read this photo, and — the part that matters — WHY a
   better one did not. Rule from the ten lost days of gate-entry photos: a
   service failure must never be presented as a bad photograph. If Gemini is out
   of quota the scanner says so, in those words, instead of letting the person
   holding the box retake it six times against a call that cannot succeed. */
const ENGINE = { gemini: 'Gemini', vision: 'Cloud Vision', docai: 'Document AI', barcode: 'Barcode' }
function engineRows(body, provider) {
  const d = body.diag || {}
  const rows = [['Read by', ENGINE[provider] || provider || '—']]
  if (typeof d.gemini === 'string' && d.gemini.startsWith('http-429')) {
    rows.push(['⚠ Note',
      '<small>Gemini is out of quota today — Cloud Vision and Document AI are '
      + 'carrying the reads. Top up the AI Studio credits to get the part '
      + 'NAMES back for unlabelled parts.</small>'])
  }
  if (d.unverified_numbers) {
    rows.push(['Ignored', `<small>${d.unverified_numbers} — the AI claimed this but no OCR engine could see it on the label.</small>`])
  }
  return rows
}

async function buildResult(body, barcode) {
  const ai = body.result
  $('busy').classList.add('hidden')
  if (scanPreviewUrl) { URL.revokeObjectURL(scanPreviewUrl); scanPreviewUrl = '' }

  if (!ai && !barcode) { showUnreadable(body.photo_path, 'Could not read anything on the photo.'); return }

  // Barcode first — it IS the part number on Hero MRP labels, decoded
  // exactly; the AI's readings follow as fallbacks.
  const candidates = [...(barcode ? [barcode] : []), ...((ai && ai.part_numbers) || [])]
  let m = await matchNumbers(candidates)
  if (m && m.ambiguous) m = await chooseMatch(m)

  if (!ai) {
    // Barcode alone (AI unreadable): still a solid identification if it matched.
    if (m) {
      const dms = await stockOf(m.hit.part_no)
      pending = {
        photo_path: body.photo_path, ocr_text: 'barcode: ' + barcode, provider: 'barcode',
        ai_name: null, ai_category: null, ai_brand: null,
        part_no: m.hit.part_no, description: m.hit.description, category: m.hit.category,
        match_method: m.hit.match_method, match_confidence: 1,
        mrp: m.hit.mrp != null ? Number(m.hit.mrp) : null,
        price_source: m.hit.mrp != null ? 'master' : null, qty: 1,
      }
      renderCard('ok', '✔ FOUND BY BARCODE', [
        ['Part no', `<b class="big">${m.hit.part_no}</b>`],
        ['Description', `<b>${m.hit.description || '—'}</b>`],
        ['Category', [m.hit.category, m.hit.subcategory].filter(Boolean).join(' · ') || '—'],
        ['MRP', `<b class="big">${money(m.hit.mrp)}</b>`],
        ['DMS stock', dms > 0 ? dms + ' pcs' : 'none'],
        ...engineRows(body, 'barcode'),
      ])
    } else {
      showUnreadable(body.photo_path,
        `Barcode read "${barcode}" but it is not in the master, and the label text was unreadable.`)
    }
    return
  }

  if (m) {
    const dms = await stockOf(m.hit.part_no)
    const mrp = m.hit.mrp != null ? Number(m.hit.mrp) : ai.printed_mrp
    pending = {
      photo_path: body.photo_path, ocr_text: ai.raw_text, provider: ai.provider,
      ai_name: ai.part_name, ai_category: ai.category, ai_brand: ai.brand,
      part_no: m.hit.part_no, description: m.hit.description, category: m.hit.category,
      match_method: m.hit.match_method, match_confidence: 1,
      mrp, price_source: m.hit.mrp != null ? 'master' : (ai.printed_mrp != null ? 'printed' : null),
      qty: ai.count_guess || 1,
    }
    renderCard('ok', m.raw === barcode ? '✔ FOUND — BARCODE MATCH' : '✔ FOUND IN MASTER', [
      ['Part no', `<b class="big">${m.hit.part_no}</b>` + (m.hit.match_method !== 'exact' ? ` <small>(${m.hit.match_method})</small>` : '')],
      ['Description', `<b>${m.hit.description || '—'}</b>`],
      ['Category', [m.hit.category, m.hit.subcategory].filter(Boolean).join(' · ') || '—'],
      ['MRP', `<b class="big">${money(mrp)}</b>` + (m.hit.mrp == null && ai.printed_mrp != null ? ' <small>(printed on label)</small>' : '')],
      ['DMS stock', dms > 0 ? dms + ' pcs' : 'none'],
      ...(m.hit.superseded_by ? [['Superseded by', m.hit.superseded_by]] : []),
      ...engineRows(body, ai.provider),
    ])
    return
  }

  /* Exact lookup missed. BEFORE calling it "not in master", correct the
     reading against the catalogue — one misread character is the ordinary case
     on a twenty-year-old Hero Honda label, not the exception. */
  let fix = await correctFromLabel(ai, candidates)
  fix = await settleCorrection(fix)
  if (fix) {
    const partNo = fix.best.part.part
    const hit = await masterRow(partNo)
    const dms = await stockOf(partNo)
    const mrp = hit && hit.mrp != null ? Number(hit.mrp) : ai.printed_mrp
    const asRead = candidates.length ? candidates.join(', ') : '(no number read)'
    pending = {
      photo_path: body.photo_path, ocr_text: ai.raw_text, provider: ai.provider,
      ai_name: ai.part_name, ai_category: ai.category, ai_brand: ai.brand,
      part_no: partNo,
      description: (hit && hit.description) || fix.best.part.desc,
      category: hit ? hit.category : (ai.category !== 'Unknown' ? ai.category : null),
      match_method: 'corrected',
      match_confidence: Number(fix.best.score) / 100,
      mrp,
      price_source: (hit && hit.mrp != null) ? 'master' : (ai.printed_mrp != null ? 'printed' : null),
      qty: ai.count_guess || 1,
    }
    /* Runners-up are listed so the scanner can see what else it was close to.
       Two parts one character apart is exactly when a human eye is worth more
       than a score. */
    const others = (fix.candidates || [])
      .filter((c) => c.part.part !== partNo).slice(0, 3)
      .map((c) => `${c.part.part} — ${c.part.desc || ''} (${c.score}%)`).join('<br>')
    renderCard('ok', '✔ CORRECTED FROM THE LABEL', [
      ['Read as', `<s>${asRead}</s>`],
      ['This part is', `<b class="big">${partNo}</b>`],
      ['Description', `<b>${pending.description || '—'}</b>`],
      ['Why', `${fix.best.why} · ${fix.best.score}% sure`],
      ['Category', hit ? ([hit.category, hit.subcategory].filter(Boolean).join(' · ') || '—') : '—'],
      ['MRP', `<b class="big">${money(mrp)}</b>`
              + ((!hit || hit.mrp == null) && ai.printed_mrp != null ? ' <small>(printed on label)</small>' : '')],
      ['DMS stock', dms > 0 ? dms + ' pcs' : 'none'],
      ...(others ? [['Not this one?', `<small>${others}<br>Type the right number below and press Find.</small>`]] : []),
      ...engineRows(body, ai.provider),
    ])
    return
  }

  if ((ai.part_numbers || []).length) {
    // A number was read, the master does not know it, and the corrector could
    // not place it either. Record it anyway — a number nobody can place today
    // is still the thing that promotes it into the master tomorrow.
    pending = {
      photo_path: body.photo_path, ocr_text: ai.raw_text, provider: ai.provider,
      ai_name: ai.part_name, ai_category: ai.category, ai_brand: ai.brand,
      part_no: ai.part_numbers[0], description: ai.part_name !== 'unknown' ? ai.part_name : null,
      category: ai.category !== 'Unknown' ? ai.category : null,
      match_method: 'none', match_confidence: 0.5,
      mrp: ai.printed_mrp, price_source: ai.printed_mrp != null ? 'printed' : null,
      qty: ai.count_guess || 1,
    }
    renderCard('warn', '⚠ NUMBER READ — NOT IN MASTER', [
      ['Part no (as read)', `<b class="big">${ai.part_numbers.join('</b>, <b>')}</b>`],
      ['Looks like', ai.part_name || '—'],
      ['Brand', ai.brand || '—'],
      ['MRP on label', money(ai.printed_mrp)],
      ['Note', 'Saved for checking — maybe a newer part or another brand.'],
      ...engineRows(body, ai.provider),
    ])
    return
  }

  // no number at all — identify visually, price by category average
  const avg = await avgFor(ai.category)
  pending = {
    photo_path: body.photo_path, ocr_text: ai.raw_text, provider: ai.provider,
    ai_name: ai.part_name, ai_category: ai.category, ai_brand: ai.brand,
    part_no: null, description: ai.part_name !== 'unknown' ? ai.part_name : null,
    category: ai.category !== 'Unknown' ? ai.category : null,
    match_method: 'visual', match_confidence: 0.3,
    mrp: ai.printed_mrp != null ? ai.printed_mrp : avg,
    price_source: ai.printed_mrp != null ? 'printed' : (avg != null ? 'category_average' : null),
    qty: ai.count_guess || 1,
  }
  renderCard('info', '👁 NO NUMBER — IDENTIFIED BY SIGHT', [
    ['Looks like', `<b class="big">${ai.part_name || '—'}</b>`],
    ['Category', ai.category || '—'],
    ['Brand', ai.brand || '—'],
    ['Avg price of this category', money(pending.mrp) + (pending.price_source === 'category_average' ? ' <small>(average — not exact)</small>' : '')],
    ...engineRows(body, ai.provider),
  ])
}

function showUnreadable(photoPath, msg) {
  pending = photoPath ? {
    photo_path: photoPath, ocr_text: null, provider: 'none',
    ai_name: null, ai_category: null, ai_brand: null,
    part_no: null, description: null, category: null,
    match_method: 'none', match_confidence: 0, mrp: null, price_source: null, qty: 1,
  } : null
  renderCard('bad', '✖ COULD NOT READ', [
    ['What now', msg + '<br>Retake closer to the label, or type the part no below.'],
  ], !photoPath)
}

function renderCard(kind, title, rows, hideSave = false) {
  const r = $('result')
  r.className = ''
  r.innerHTML = `
    <div class="band ${kind}">${title}</div>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
    ${hideSave ? '' : `
    <div class="qtyrow">
      <span style="font-size:14px;color:#666">Qty</span>
      <button id="qMinus">−</button>
      <input id="qty" type="number" min="1" value="${pending ? pending.qty : 1}">
      <button id="qPlus">+</button>
    </div>
    <div class="saverow">
      <button class="btn btn-red" id="saveBtn" style="flex:2">💾 SAVE PART</button>
      <button class="btn btn-grey" id="skipBtn" style="flex:1">Scan next</button>
    </div>`}
  `
  if (!hideSave) {
    $('qMinus').onclick = () => { const q = $('qty'); q.value = Math.max(1, +q.value - 1) }
    $('qPlus').onclick = () => { const q = $('qty'); q.value = +q.value + 1 }
    $('saveBtn').onclick = savePending
    $('skipBtn').onclick = () => { r.classList.add('hidden'); pending = null; $('camInput').click() }
  }
  r.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

// ---------------------------------------------------------------- saving
async function savePending() {
  if (!pending) return
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…'
  const row = {
    ...pending,
    qty: Math.max(1, +($('qty')?.value || pending.qty || 1)),
    box_no: $('boxNo').value.trim() || null,
    condition: $('cond').value,
  }
  const { error } = await sb.from('scanned_parts').insert(row)
  if (error) {
    btn.disabled = false; btn.textContent = '💾 SAVE PART'
    toast('Save failed: ' + error.message)
    return
  }
  pending = null
  $('result').classList.add('hidden')
  toast('Saved ✔')
  refreshLog()
}

// ---------------------------------------------------------------- manual find
async function manualFind() {
  const raw = $('manualNo').value.trim()
  if (!raw) return
  $('result').classList.add('hidden')
  const { data, error } = await sb.rpc('match_part', { p_raw: raw })
  if (error) { toast(error.message); return }
  if (data && data.length) {
    const tier = data[0].match_method, seen = new Set()
    const top = data.filter((x) => x.match_method === tier)
      .filter((x) => { if (seen.has(x.part_no)) return false; seen.add(x.part_no); return true })
    const chosen = top.length > 1
      ? await chooseMatch({ ambiguous: true, raw, hits: top.map((hit) => ({ raw, hit })) })
      : { raw, hit: top[0] }
    const hit = chosen.hit
    const dms = await stockOf(hit.part_no)
    pending = {
      photo_path: null, ocr_text: 'manual: ' + raw, provider: 'none',
      ai_name: null, ai_category: null, ai_brand: null,
      part_no: hit.part_no, description: hit.description, category: hit.category,
      match_method: 'manual', match_confidence: 1,
      mrp: hit.mrp != null ? Number(hit.mrp) : null,
      price_source: hit.mrp != null ? 'master' : null, qty: 1,
    }
    renderCard('ok', '✔ FOUND IN MASTER (typed)', [
      ['Part no', `<b class="big">${hit.part_no}</b>`],
      ['Description', `<b>${hit.description || '—'}</b>`],
      ['Category', [hit.category, hit.subcategory].filter(Boolean).join(' · ') || '—'],
      ['MRP', `<b class="big">${money(hit.mrp)}</b>`],
      ['DMS stock', dms > 0 ? dms + ' pcs' : 'none'],
    ])
  } else {
    /* Same courtesy as the camera path: a number typed off a worn box is as
       likely to be one character out as a number read off one. */
    let fix = await correctFromLabel({ raw_text: raw, part_name: '' }, [raw])
    fix = await settleCorrection(fix)
    if (fix) {
      const partNo = fix.best.part.part
      const hit = await masterRow(partNo)
      const dms = await stockOf(partNo)
      pending = {
        photo_path: null, ocr_text: 'manual: ' + raw, provider: 'none',
        ai_name: null, ai_category: null, ai_brand: null,
        part_no: partNo,
        description: (hit && hit.description) || fix.best.part.desc,
        category: hit ? hit.category : null,
        match_method: 'corrected', match_confidence: Number(fix.best.score) / 100,
        mrp: hit && hit.mrp != null ? Number(hit.mrp) : null,
        price_source: hit && hit.mrp != null ? 'master' : null, qty: 1,
      }
      renderCard('ok', '✔ CORRECTED (typed)', [
        ['Typed', `<s>${raw}</s>`],
        ['This part is', `<b class="big">${partNo}</b>`],
        ['Description', `<b>${pending.description || '—'}</b>`],
        ['Why', `${fix.best.why} · ${fix.best.score}% sure`],
        ['MRP', `<b class="big">${money(pending.mrp)}</b>`],
        ['DMS stock', dms > 0 ? dms + ' pcs' : 'none'],
      ])
      return
    }
    showUnreadable(null, `"${raw}" is not in the master, and nothing close enough to it is either.`)
  }
}

// ---------------------------------------------------------------- today log
async function refreshLog() {
  const today = new Date(); today.setHours(0, 0, 0, 0)
  // A removed scan is gone from this list for everyone EXCEPT the CEO id, who
  // keeps seeing it struck through with a ↩ so a wrong ✕ costs one tap to undo.
  let q = sb.from('scanned_parts')
    .select('id, scanned_at, part_no, description, ai_name, mrp, qty, match_method, removed_at')
    .gte('scanned_at', today.toISOString())
  if (!canRemove) q = q.is('removed_at', null)
  const { data } = await q.order('scanned_at', { ascending: false }).limit(200)
  const rows = data || []
  const live = rows.filter((r) => !r.removed_at)
  // The list holds the latest 200 only, so the day's total comes from the
  // server (0114 ps_today_sb) — adding up the list stood still past 200 scans.
  let tot = null
  try { const t = await sb.rpc('ps_today_sb'); if (t.data && isFinite(Number(t.data.pcs))) tot = t.data } catch (e) {}
  $('nToday').textContent = tot ? Number(tot.pcs) : live.reduce((s, r) => s + (r.qty || 1), 0)
  $('vToday').textContent = Math.round(tot ? Number(tot.value) || 0 : live.reduce((s, r) => s + (Number(r.mrp) || 0) * (r.qty || 1), 0)).toLocaleString('en-IN')
  $('log').innerHTML = '<table>' + rows.map((r) => {
    const gone = !!r.removed_at
    const label = (r.part_no || r.description || r.ai_name || 'this scan').replace(/"/g, '')
    const act = canRemove
      ? `<td><button class="rm" data-id="${r.id}" data-label="${label}" data-act="${gone ? 'restore' : 'remove'}"
           title="${gone ? 'Put this scan back' : 'CEO only: remove this scan'}">${gone ? '↩' : '✕'}</button></td>`
      : ''
    return `
    <tr${gone ? ' class="gone"' : ''}>
      <td>${new Date(r.scanned_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</td>
      <td class="m-${r.match_method}">${r.part_no || '(no number)'}</td>
      <td class="desc">${r.description || r.ai_name || ''}</td>
      <td>${r.qty}×</td>
      <td>${money(r.mrp)}</td>${act}
    </tr>`
  }).join('') + '</table>'
  $('log').querySelectorAll('button.rm').forEach((b) => { b.onclick = () => removeScan(b) })
}

/** CEO only. Remove = mark removed (0080), never delete: the row keeps its
 *  photo, its OCR text and its price, an audit_log line records who and why,
 *  and ↩ puts it straight back. */
async function removeScan(btn) {
  const id = btn.dataset.id, label = btn.dataset.label || 'this scan'
  const restoring = btn.dataset.act === 'restore'
  if (!restoring && !confirm(`Remove ${label} from the scanned parts list?\n\nNothing is deleted — it can be put back.`)) return
  const why = restoring ? '' : (prompt('Why is it being removed? (optional)', '') || '')
  btn.disabled = true
  const { error } = restoring
    ? await sb.rpc('ps_restore_scan', { p_id: id })
    : await sb.rpc('ps_remove_scan', { p_id: id, p_reason: why })
  btn.disabled = false
  if (error) { toast(error.message || 'Could not do that'); return }
  toast(restoring ? `${label} is back` : `${label} removed`)
  refreshLog()
}

// ---------------------------------------------------------------- wiring
$('loginBtn').onclick = signIn
$('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn() })
$('scanBtn').onclick = () => $('camInput').click()
$('camInput').addEventListener('change', (e) => { onPhoto(e.target.files[0]); e.target.value = '' })
$('manualBtn').onclick = manualFind
$('manualNo').addEventListener('keydown', (e) => { if (e.key === 'Enter') manualFind() })
$('logToggle').onclick = () => {
  const l = $('log'); const open = !l.classList.contains('hidden')
  l.classList.toggle('hidden', open)
  $('logToggle').textContent = open ? '▸ list' : '▾ list'
}

// resume a session if one exists
enter()
</script>

<!-- ================= R174 FULL-SCREEN CAMERA (CAM01) ================= -->
<div id="hero-fscam-ov" role="dialog" aria-modal="true" aria-label="Full Screen Camera">
  <div id="hero-fscam-stage" onclick="heroFsCamTapFocus(event)">
    <video id="hero-fscam-vid" autoplay playsinline muted></video>
    <img id="hero-fscam-preview" alt="Captured preview">
    <div id="hero-fscam-focus-ring"></div>
  </div>
  <div id="hero-fscam-top">
    <div id="hero-fscam-title">Camera</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" id="hero-fscam-torch" class="hero-fscam-pill" onclick="heroFsCamToggleTorch()" style="display:none">🔦 Torch</button>
      <button type="button" id="hero-fscam-flip" class="hero-fscam-pill" onclick="heroFsCamFlip()">🔄 Flip</button>
      <button type="button" id="hero-fscam-close" class="hero-fscam-pill" onclick="heroFsCamClose()">✕ Close</button>
    </div>
  </div>
  <div id="hero-fscam-mid">
    <div id="hero-fscam-exp-wrap">
      <span>☀️ Exposure</span>
      <input id="hero-fscam-exp" type="range" min="-2" max="2" step="0.25" value="0" oninput="heroFsCamSetExposure(this.value)">
      <span id="hero-fscam-exp-val">0.0</span>
    </div>
    <div id="hero-fscam-status">Tap screen to focus · Full-screen HD capture</div>
  </div>
  <div id="hero-fscam-bot">
    <button type="button" id="hero-fscam-gallery" class="hero-fscam-pill" onclick="heroFsCamOpenGallery()">🖼️ Gallery</button>
    <button type="button" id="hero-fscam-shutter" onclick="heroFsCamSnap()" aria-label="Capture Photo"></button>
    <div id="hero-fscam-confirm-bar" style="display:none;gap:12px;align-items:center;width:100%;justify-content:center">
      <button type="button" class="hero-fscam-act retake" onclick="heroFsCamRetake()">↺ Retake</button>
      <button type="button" class="hero-fscam-act" onclick="heroFsCamUse()">✓ Use Photo</button>
    </div>
    <div id="hero-fscam-spacer" style="width:82px"></div>
  </div>
</div>
<script>
(function(){
  let fsStream = null;
  let fsTrack = null;
  let fsFacing = 'environment';
  let fsTorch = false;
  let fsTargetInput = null;
  let fsCapturedBlob = null;
  let fsBypassOnce = false;

  function stopStream(){
    if(fsStream){
      try{ fsStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      fsStream = null;
      fsTrack = null;
    }
    fsTorch = false;
  }

  async function startStream(){
    stopStream();
    const vid = document.getElementById('hero-fscam-vid');
    const prev = document.getElementById('hero-fscam-preview');
    const st = document.getElementById('hero-fscam-status');
    const torchBtn = document.getElementById('hero-fscam-torch');
    const expWrap = document.getElementById('hero-fscam-exp-wrap');
    const expIn = document.getElementById('hero-fscam-exp');
    const expVal = document.getElementById('hero-fscam-exp-val');
    if(prev) prev.style.display = 'none';
    if(vid){ vid.style.display = 'block'; vid.style.filter = 'brightness(1)'; }
    if(expIn) expIn.value = '0';
    if(expVal) expVal.textContent = '0.0';

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      if(st) st.textContent = 'Live camera stream unavailable — tap Gallery to pick photo';
      return false;
    }
    try{
      fsStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: fsFacing },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      if(vid){
        vid.srcObject = fsStream;
        await vid.play().catch(function(){});
      }
      const tracks = fsStream.getVideoTracks();
      fsTrack = tracks && tracks.length ? tracks[0] : null;
      if(fsTrack && typeof fsTrack.getCapabilities === 'function'){
        const caps = fsTrack.getCapabilities() || {};
        if(torchBtn) torchBtn.style.display = caps.torch ? 'inline-flex' : 'none';
        if(caps.focusMode && caps.focusMode.indexOf('continuous') !== -1){
          try{ await fsTrack.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
        }
        if(caps.exposureCompensation && expIn){
          expIn.min = caps.exposureCompensation.min ?? -2;
          expIn.max = caps.exposureCompensation.max ?? 2;
          expIn.step = caps.exposureCompensation.step || 0.25;
        }
      } else if(torchBtn){
        torchBtn.style.display = 'none';
      }
      if(expWrap) expWrap.style.display = 'flex';
      if(st) st.textContent = 'Tap screen to focus · Full-screen HD capture';
      return true;
    }catch(err){
      if(st) st.textContent = 'Camera permission required — tap Gallery or allow camera access';
      return false;
    }
  }

  window.heroFsCamOpen = function(inputEl, titleText){
    fsTargetInput = inputEl || null;
    fsCapturedBlob = null;
    const capAttr = inputEl ? (inputEl.getAttribute('capture') || 'environment') : 'environment';
    fsFacing = (capAttr === 'user') ? 'user' : 'environment';
    const ov = document.getElementById('hero-fscam-ov');
    const tt = document.getElementById('hero-fscam-title');
    const sh = document.getElementById('hero-fscam-shutter');
    const gal = document.getElementById('hero-fscam-gallery');
    const sp = document.getElementById('hero-fscam-spacer');
    const cb = document.getElementById('hero-fscam-confirm-bar');
    if(!ov) return;
    if(tt) tt.textContent = titleText || 'Full-Screen Camera';
    if(sh) sh.style.display = 'flex';
    if(gal) gal.style.display = 'inline-flex';
    if(sp) sp.style.display = 'block';
    if(cb) cb.style.display = 'none';
    ov.classList.add('on');
    ov.style.display = 'flex';
    if(typeof window.heroSyncModalLock === 'function') window.heroSyncModalLock();
    startStream();
  };

  window.heroFsCamClose = function(){
    stopStream();
    const ov = document.getElementById('hero-fscam-ov');
    if(ov){
      ov.classList.remove('on');
      ov.style.display = 'none';
    }
    if(typeof window.heroSyncModalLock === 'function') window.heroSyncModalLock();
  };

  window.heroFsCamFlip = function(){
    fsFacing = (fsFacing === 'environment') ? 'user' : 'environment';
    startStream();
  };

  window.heroFsCamToggleTorch = async function(){
    if(!fsTrack) return;
    fsTorch = !fsTorch;
    const btn = document.getElementById('hero-fscam-torch');
    try{
      await fsTrack.applyConstraints({advanced:[{torch: fsTorch}]});
      if(btn) btn.classList.toggle('active', fsTorch);
    }catch(e){
      fsTorch = false;
      if(btn) btn.classList.remove('active');
    }
  };

  window.heroFsCamSetExposure = async function(val){
    const num = parseFloat(val) || 0;
    const lbl = document.getElementById('hero-fscam-exp-val');
    if(lbl) lbl.textContent = (num >= 0 ? '+' : '') + num.toFixed(1);
    const vid = document.getElementById('hero-fscam-vid');
    if(fsTrack && typeof fsTrack.getCapabilities === 'function'){
      const caps = fsTrack.getCapabilities() || {};
      if(caps.exposureCompensation){
        try{
          await fsTrack.applyConstraints({advanced:[{exposureCompensation: num}]});
          return;
        }catch(e){}
      }
    }
    /* Software brightness fallback when hardware exposureCompensation isn't exposed */
    if(vid){
      const b = 1 + (num * 0.18);
      vid.style.filter = 'brightness(' + b.toFixed(2) + ')';
    }
  };

  window.heroFsCamTapFocus = async function(ev){
    const stage = document.getElementById('hero-fscam-stage');
    const ring = document.getElementById('hero-fscam-focus-ring');
    if(!stage || !ring) return;
    const rect = stage.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.classList.add('active');
    setTimeout(function(){ ring.classList.remove('active'); }, 650);
    if(fsTrack && typeof fsTrack.getCapabilities === 'function'){
      const caps = fsTrack.getCapabilities() || {};
      if(caps.focusMode){
        try{
          const nx = Math.max(0, Math.min(1, x / Math.max(1, rect.width)));
          const ny = Math.max(0, Math.min(1, y / Math.max(1, rect.height)));
          await fsTrack.applyConstraints({advanced:[{pointsOfInterest:[{x:nx, y:ny}], focusMode:'single-shot'}]});
        }catch(e){}
      }
    }
  };

  window.heroFsCamSnap = function(){
    const vid = document.getElementById('hero-fscam-vid');
    const prev = document.getElementById('hero-fscam-preview');
    const sh = document.getElementById('hero-fscam-shutter');
    const gal = document.getElementById('hero-fscam-gallery');
    const sp = document.getElementById('hero-fscam-spacer');
    const cb = document.getElementById('hero-fscam-confirm-bar');
    const st = document.getElementById('hero-fscam-status');
    if(!vid) return;
    const w = vid.videoWidth || 1280;
    const h = vid.videoHeight || 720;
    const cvs = document.createElement('canvas');
    cvs.width = w;
    cvs.height = h;
    const ctx = cvs.getContext('2d');
    const expVal = parseFloat((document.getElementById('hero-fscam-exp')||{}).value || '0') || 0;
    if(expVal !== 0){
      ctx.filter = 'brightness(' + (1 + expVal * 0.18).toFixed(2) + ')';
    }
    if(fsStream && vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, w, h);
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Inter, sans-serif';
      ctx.fillText('Captured Frame ' + new Date().toLocaleTimeString(), 40, h/2);
    }
    cvs.toBlob(function(blob){
      fsCapturedBlob = blob;
      if(prev && blob){
        prev.src = URL.createObjectURL(blob);
        prev.style.display = 'block';
        vid.style.display = 'none';
      }
      if(sh) sh.style.display = 'none';
      if(gal) gal.style.display = 'none';
      if(sp) sp.style.display = 'none';
      if(cb) cb.style.display = 'flex';
      if(st) st.textContent = 'Review capture — Use Photo or Retake';
    }, 'image/jpeg', 0.92);
  };

  window.heroFsCamRetake = function(){
    fsCapturedBlob = null;
    const vid = document.getElementById('hero-fscam-vid');
    const prev = document.getElementById('hero-fscam-preview');
    const sh = document.getElementById('hero-fscam-shutter');
    const gal = document.getElementById('hero-fscam-gallery');
    const sp = document.getElementById('hero-fscam-spacer');
    const cb = document.getElementById('hero-fscam-confirm-bar');
    const st = document.getElementById('hero-fscam-status');
    if(prev) prev.style.display = 'none';
    if(vid) vid.style.display = 'block';
    if(sh) sh.style.display = 'flex';
    if(gal) gal.style.display = 'inline-flex';
    if(sp) sp.style.display = 'block';
    if(cb) cb.style.display = 'none';
    if(st) st.textContent = 'Tap screen to focus · Full-screen HD capture';
    if(!fsStream) startStream();
  };

  window.heroFsCamUse = function(){
    if(!fsCapturedBlob || !fsTargetInput){
      heroFsCamClose();
      return;
    }
    try{
      const file = new File([fsCapturedBlob], 'camera_' + Date.now() + '.jpg', {type:'image/jpeg'});
      const dt = new DataTransfer();
      dt.items.add(file);
      fsTargetInput.files = dt.files;
      fsTargetInput.dispatchEvent(new Event('change', {bubbles:true}));
    }catch(e){}
    heroFsCamClose();
  };

  window.heroFsCamOpenGallery = function(){
    const inp = fsTargetInput;
    heroFsCamClose();
    if(inp){
      fsBypassOnce = true;
      const prevCap = inp.getAttribute('capture');
      inp.removeAttribute('capture');
      inp.click();
      setTimeout(function(){
        if(prevCap) inp.setAttribute('capture', prevCap);
        fsBypassOnce = false;
      }, 600);
    }
  };

  /* Intercept clicks on <input type="file" capture="..."> so every camera action opens Full-Screen Camera (CAM01) */
  document.addEventListener('click', function(ev){
    if(fsBypassOnce) return;
    let el = ev.target;
    if(!el) return;
    if(el.tagName === 'LABEL'){
      const sub = el.querySelector('input[type="file"][capture]');
      if(sub) el = sub;
    }
    if(el.tagName === 'INPUT' && el.type === 'file' && el.hasAttribute('capture')){
      ev.preventDefault();
      ev.stopPropagation();
      let labelText = 'Full-Screen Camera';
      if(el.id && el.id.indexOf('ge-photo-') === 0){
        labelText = 'Gate Photo · ' + el.id.replace('ge-photo-','').toUpperCase();
      } else if(el.id === 'r2-selfie'){
        labelText = 'Selfie Capture';
      } else if(el.id === 'ravi-doc-file'){
        labelText = 'Document / Photo Scan';
      } else if(el.getAttribute('onchange') && el.getAttribute('onchange').indexOf('geVinFromPhoto') !== -1){
        labelText = 'RC / Frame VIN Scan';
      }
      window.heroFsCamOpen(el, labelText);
    }
  }, true);
})();
</script>
